<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morph – real-time particle shapes</title>
<style>
:root{--bg:#0e1116;--fg:#e8ecf2;--muted:#8d97a8;--panel:rgba(20,25,34,.78);--line:#2a3342;--accent:#ffb454;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1ee;--fg:#1b1f27;--muted:#5c6575;--panel:rgba(255,255,255,.82);--line:#d6d2cb;--accent:#c4560a}}
:root[data-theme="dark"]{--bg:#0e1116;--fg:#e8ecf2;--muted:#8d97a8;--panel:rgba(20,25,34,.78);--line:#2a3342;--accent:#ffb454}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;pointer-events:none}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#14110c;border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.title{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;max-width:360px}
.title h1{font-size:1.5rem;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.title p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.45}
.hud{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);text-align:right;line-height:1.6}
.hud b{color:var(--fg);font-weight:600}
label{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center}
input[type=range]{accent-color:var(--accent)}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap">
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>Morph</h1><p>60,000 GPU particles blending between shapes. Move the cursor to push them, click or tap to pulse.</p></div>
<div class="hud" aria-live="off">
  <div>FPS <b id="fps">–</b></div>
  <div>Frame <b id="ms">–</b> ms</div>
  <div>Morph start <b id="lat">–</b> ms</div>
</div>
<div class="ui">
  <div class="panel btns" id="shapes" role="group" aria-label="Shape"></div>
  <div class="panel"><label>Swirl <input id="swirl" type="range" min="0" max="1" step="0.01" value="0.35"></label></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const N = 60000;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
camera.position.z = 6;

/* ---- Target shape generators (each returns Float32Array of N*3) ---- */
const rnd = Math.random;
const shapes = {
  Sphere(){ const a=new Float32Array(N*3);
    for(let i=0;i<N;i++){ const u=rnd()*2-1, t=rnd()*Math.PI*2, r=Math.sqrt(1-u*u)*2;
      a.set([r*Math.cos(t), u*2, r*Math.sin(t)], i*3);} return a; },
  Torus(){ const a=new Float32Array(N*3);
    for(let i=0;i<N;i++){ const u=rnd()*Math.PI*2, v=rnd()*Math.PI*2, R=1.7, r=0.6;
      a.set([(R+r*Math.cos(v))*Math.cos(u), r*Math.sin(v)*1.2, (R+r*Math.cos(v))*Math.sin(u)], i*3);} return a; },
  Cube(){ const a=new Float32Array(N*3);
    for(let i=0;i<N;i++){ const f=Math.floor(rnd()*6), s=f%2?1.7:-1.7, p=[rnd()*3.4-1.7, rnd()*3.4-1.7];
      const v=[0,0,0]; const ax=f>>1; v[ax]=s; v[(ax+1)%3]=p[0]; v[(ax+2)%3]=p[1]; a.set(v,i*3);} return a; },
  Helix(){ const a=new Float32Array(N*3);
    for(let i=0;i<N;i++){ const t=rnd()*Math.PI*8-Math.PI*4, s=i%2?0:Math.PI, r=1.3+rnd()*0.15;
      a.set([r*Math.cos(t+s), t*0.45, r*Math.sin(t+s)], i*3);} return a; },
  Galaxy(){ const a=new Float32Array(N*3);
    for(let i=0;i<N;i++){ const r=Math.pow(rnd(),0.7)*3, arm=(i%3)*2.094, t=r*1.6+arm+(rnd()-.5)*.5;
      a.set([r*Math.cos(t), (rnd()-.5)*0.25*(3-r)*.5, r*Math.sin(t)], i*3);} return a; }
};
const names = Object.keys(shapes);
const targets = {}; names.forEach(n=>targets[n]=shapes[n]());

/* ---- Geometry & shader material ---- */
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(targets[names[0]].slice(),3));
geo.setAttribute('aTarget',  new THREE.BufferAttribute(targets[names[1]].slice(),3));
geo.setAttribute('aSeed',    new THREE.BufferAttribute(Float32Array.from({length:N},()=>rnd()),1));

const mat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uMix:{value:0}, uTime:{value:0}, uMouse:{value:new THREE.Vector3(99,99,0)},
             uPulse:{value:0}, uSwirl:{value:0.35}, uSize:{value:2.2*renderer.getPixelRatio()},
             uA:{value:new THREE.Color('#ffb454')}, uB:{value:new THREE.Color('#4cc9f0')} },
  vertexShader:`
    attribute vec3 aTarget; attribute float aSeed;
    uniform float uMix,uTime,uPulse,uSwirl,uSize; uniform vec3 uMouse;
    varying float vT; varying float vD;
    mat2 rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
    void main(){
      // staggered ease so particles arrive at different moments
      float m = smoothstep(aSeed*0.45, aSeed*0.45+0.55, uMix);
      vec3 p = mix(position, aTarget, m);
      // swirl around Y axis, stronger further from center
      p.xz *= rot(uTime*0.15 + uSwirl*length(p.xz)*0.25*sin(uTime*0.3));
      // cursor repulsion (in view-ish space)
      vec3 d = p - uMouse; float dist = length(d);
      p += normalize(d+1e-4) * smoothstep(1.6,0.0,dist) * 0.8;
      // click pulse ripples outward
      float r = length(p);
      p += normalize(p+1e-4) * sin(r*4.0 - uPulse*10.0) * 0.25 * exp(-uPulse*2.0);
      // idle shimmer
      p += 0.02*vec3(sin(uTime+aSeed*40.0), cos(uTime*1.3+aSeed*30.0), sin(uTime*0.7+aSeed*20.0));
      vT = clamp(p.y*0.25+0.5, 0.0, 1.0); vD = dist;
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      gl_PointSize = uSize*(5.0/-mv.z);
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform vec3 uA,uB; varying float vT; varying float vD;
    void main(){
      float d = length(gl_PointCoord-0.5);
      if(d>0.5) discard;
      float a = smoothstep(0.5,0.0,d);
      vec3 col = mix(uA,uB,vT) + smoothstep(1.2,0.0,vD)*0.4;
      gl_FragColor = vec4(col, a*0.55);
    }`
});
const points = new THREE.Points(geo, mat);
scene.add(points);

/* ---- Morph state ---- */
let current = names[0], target = names[1], mixing = false, mixStart = 0, t0 = 0;
const DUR = 1800;
const posAttr = geo.attributes.position, tgtAttr = geo.attributes.aTarget;
function morphTo(name){
  if(name===current && !mixing) return;
  const t1 = performance.now();
  // commit current state as source
  if(mixing){ current = target; }
  posAttr.array.set(targets[current]); posAttr.needsUpdate = true;
  tgtAttr.array.set(targets[name]); tgtAttr.needsUpdate = true;
  target = name; mat.uniforms.uMix.value = 0; mixing = true; mixStart = performance.now();
  requestAnimationFrame(()=>{ document.getElementById('lat').textContent = (performance.now()-t1).toFixed(1); });
  document.querySelectorAll('#shapes button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.n===name));
}
const wrap = document.getElementById('shapes');
names.forEach(n=>{ const b=document.createElement('button'); b.textContent=n; b.dataset.n=n;
  b.setAttribute('aria-pressed', n===target); b.onclick=()=>morphTo(n); wrap.appendChild(b); });

/* ---- Input ---- */
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0,0,1),0), hit = new THREE.Vector3();
const ndc = new THREE.Vector2(); let pulseT = 99;
function setPointer(e){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera); if(ray.ray.intersectPlane(plane,hit)) mat.uniforms.uMouse.value.copy(hit); }
addEventListener('pointermove', setPointer);
canvas.addEventListener('pointerdown', e=>{ setPointer(e); pulseT = 0; });
addEventListener('pointerleave', ()=>mat.uniforms.uMouse.value.set(99,99,0));
document.getElementById('swirl').oninput = e=>mat.uniforms.uSwirl.value = +e.target.value;

function resize(){ renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight; camera.fov = innerWidth<innerHeight?75:55; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ---- Loop ---- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), acc = 0, frames = 0, fpsT = last;
function loop(now){
  const dt = now-last; last = now; acc += dt; frames++;
  if(now-fpsT>500){ document.getElementById('fps').textContent = Math.round(frames*1000/(now-fpsT));
    document.getElementById('ms').textContent = (acc/frames).toFixed(1); frames=0; acc=0; fpsT=now; }
  if(mixing){ const k = Math.min((now-mixStart)/DUR,1); mat.uniforms.uMix.value = k;
    if(k>=1){ mixing=false; current=target; } }
  pulseT += dt/1000; mat.uniforms.uPulse.value = pulseT;
  mat.uniforms.uTime.value = reduce ? 0 : now/1000;
  points.rotation.x += (ndc.y*0.4 - points.rotation.x)*0.04;
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
mixStart = performance.now(); mixing = true;
requestAnimationFrame(loop);

// auto-cycle until the user interacts
let auto = setInterval(()=>morphTo(names[(names.indexOf(target)+1)%names.length]), 5000);
addEventListener('pointerdown', ()=>clearInterval(auto), {once:true});
})();
</script>
</body>
</html>
